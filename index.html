<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5.25 호우 대응 3부처 보도자료 검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="head-top">
      <h1>5.25 호우 대응 3부처 보도자료 검색</h1>
      <p class="sub">행정안전부 대변인실 · 2026-05-25 호우 대응 부처 합동 보도자료 열람</p>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <input id="q" type="search" placeholder="검색어 입력 (예: 호우, 중대본, 인명피해, 기상청)" autocomplete="off" aria-label="보도자료 검색">
        <button id="clear" type="button" title="검색어 지우기" aria-label="검색어 지우기">×</button>
      </div>
      <span id="count" aria-live="polite"></span>
    </div>
    <div id="depts" class="depts" role="group" aria-label="부처별 필터"></div>
  </header>

  <main id="list" aria-label="보도자료 목록"></main>

  <footer>
    <p>검색은 제목·본문·부처명을 대상으로 하며 대소문자를 구분하지 않습니다. 자료 출처: 3개_보도자료_묶음.md (가상 데이터)</p>
  </footer>

  <script src="데이터.js"></script>
  <script src="app.js"></script>
</body>
</html>
